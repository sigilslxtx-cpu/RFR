<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#162c3f">
  <meta name="description" content="Offline-first genealogy research manager with time tracking, evidence, sources, and relationship diagrams.">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>PRB Research Manager</title>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brandmark">PRB</span><span><strong>Research Manager</strong><small>PROVENANCE RESEARCH BUREAU</small></span></div>
      <div class="nav-caption">WORKSPACE</div>
      <nav id="nav" aria-label="Main sections"></nav>
      <div class="sidebar-foot"><span class="status-dot"></span> Local workspace <small id="saveStatus">Checking storage…</small><small id="appBuild">PRB build loading…</small></div>
    </aside>
    <div class="workarea">
      <header class="topbar">
        <div class="top-left"><button id="menuButton" aria-label="Open navigation" class="icon-btn mobile-menu">☰</button><div><div class="eyebrow">PROVENANCE RESEARCH BUREAU</div><h1 id="pageTitle">Dashboard</h1></div></div>
        <div class="top-actions"><select id="activeProject" aria-label="Active project"><option value="">All projects</option></select><button id="quickCaptureButton" class="btn" title="Capture a task or research idea">+ Capture</button><button id="globalSearchButton" class="icon-btn" title="Search records" aria-label="Search records">⌕</button><button id="newButton" class="btn primary">+ New</button></div>
      </header>
      <section id="timerBar" class="timerbar" aria-label="Research work timer">
        <div class="timer-ident"><span class="timer-icon">◷</span><div><strong>Research timer</strong><small id="timerContext">No active session</small></div></div>
        <div class="timer-clock"><div class="timer-value" id="timerValue" aria-live="off">00:00:00</div><small id="timerStartedAt" class="timer-started" aria-live="off">Start time: —</small></div>
        <div class="timer-controls"><span class="timer-state" id="timerState">Idle</span><button class="btn small green" id="timerStart">▶ Start</button><button class="btn small ghost hidden" id="timerPause">Ⅱ Pause</button><button class="btn small ghost hidden" id="timerStop">■ Finish</button></div>
      </section>
      <div id="sourceStatusLegend" class="source-status-legend" aria-label="Source status code legend"></div>
      <main id="main" tabindex="-1"><noscript>This app needs JavaScript enabled.</noscript></main>
    </div>
  </div>
  <div class="overlay hidden" id="modalBackdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">Edit record</h2><button class="icon-btn" id="closeModal" aria-label="Close dialog">✕</button></div><div id="modalBody"></div></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
