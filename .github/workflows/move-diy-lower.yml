name: Move DIY content lower
on:
  push:
    paths:
      - '.github/workflows/move-diy-lower.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move DIY section below policies
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          m=re.search(r'<section class="section alt diy" id="diy-file-rescue">.*?</section>',s,re.S)
          if not m:
              raise SystemExit('DIY section not found')
          block=m.group(0)
          s=s[:m.start()]+s[m.end():]
          # Put DIY/Horror Stories after Policies and before certificate/affiliation when possible.
          policy=re.search(r'<section[^>]*id="policies"[^>]*>.*?</section>',s,re.S)
          if policy:
              pos=policy.end()
          else:
              # fallback: place immediately before affiliation/certificate section
              aff=re.search(r'<section[^>]*>\s*<div class="container affiliation"',s,re.S)
              if not aff:
                  raise SystemExit('Insertion point not found')
              pos=aff.start()
          s=s[:pos]+'\n'+block+'\n'+s[pos:]
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Move DIY and horror stories below core sales content"
          git push