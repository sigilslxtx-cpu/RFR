name: 08.28.26 Advise at 80 Percent
on:
  push:
    paths:
      - '.github/workflows/08.28.26_advise_at_80_percent.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update 80 percent wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            'I’ll warn you':'I’ll advise you',
            "I'll warn you":"I'll advise you",
            'I will warn you':'I will advise you',
            'warn you that you’re approaching':'advise you that you’re approaching',
            "warn you that you're approaching":"advise you that you're approaching",
          }
          for a,b in replacements.items(): s=s.replace(a,b)
          # Replace likely prior explanatory sentence with explicit, non-arbitrary 80% language.
          candidates=[
            'Your written plan will show your maximum project cost and the point where I’ll advise you that you’re approaching it.',
            "Your written plan will show your maximum project cost and the point where I'll advise you that you're approaching it.",
            'Your written plan will show your maximum project cost and the 80% point when I’ll advise you that you’re approaching it. For labor-only projects, I’ll also translate that into approximate hours.',
          ]
          new='Your written plan will show your maximum project cost and the 80% point when I’ll advise you that you’re approaching it. For labor-only projects, I’ll also translate that into approximate hours.'
          for old in candidates:
            if old in s:
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/08.28.26_advise_at_80_percent.yml
          git commit -m 'Use advise wording and retain 80 percent threshold'
          git push
