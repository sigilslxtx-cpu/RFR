name: Update employee comparison heading

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-employee-heading.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update heading
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'Why compare the rate with the real cost of an employee?'
          new = 'How does $30/hour compare with hiring an employee?'
          if old not in s:
              raise SystemExit('Expected heading not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update employee cost comparison heading"
          git push
