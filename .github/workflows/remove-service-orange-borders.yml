name: Remove service-card orange borders
on:
  push:
    paths:
      - '.github/workflows/remove-service-orange-borders.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize service cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='.wide{grid-column:1/-1;border-left:5px solid var(--orange)}'
          new='.wide{grid-column:1/-1}'
          if old not in s:
              raise SystemExit('Expected wide-card orange border rule not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Remove orange accent borders from service cards"
          git push