name: RFR v7.2 alignment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rfr-v72-alignment.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document tooling
        run: |
          python -m pip install --quiet python-docx
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice-writer
          fi
      - name: Align current RFR forms and website
        run: |
          python <<'PY'
          from pathlib import Path
          from docx import Document
          from docx.oxml import OxmlElement
          from docx.text.paragraph import Paragraph

          def replace_para_text(p, text):
              if p.runs:
                  p.runs[0].text = text
                  for r in p.runs[1:]: r.text = ''
              else:
                  p.add_run(text)

          def insert_after(p, text):
              new_p = OxmlElement('w:p')
              p._p.addnext(new_p)
              q = Paragraph(new_p, p._parent)
              try: q.style = p.style
              except Exception: pass
              q.add_run(text)
              return q

          def footer_v11(doc):
              for sec in doc.sections:
                  for p in sec.footer.paragraphs:
                      for r in p.runs:
                          r.text = r.text.replace('Pilot Forms v1.0','Pilot Forms v1.1')

          # 01 Intake
          path=Path('forms/08.26.26_01_Customer_Intake_Form.docx')
          doc=Document(path)
          for p in doc.paragraphs:
              if 'Pilot Forms v1.0' in p.text:
                  replace_para_text(p,'Pilot Forms v1.1 | September 9, 2026')
              if p.text.strip() == '[ ] Legal / dispute-related material':
                  replace_para_text(p,'[ ] Active or reasonably anticipated litigation / legal-dispute material')
          footer_v11(doc); doc.save(path)

          # 02 Qualification
          path=Path('forms/08.26.26_02_Qualification_Checklist.docx')
          doc=Document(path)
          for p in doc.paragraphs:
              if 'Pilot Forms v1.0' in p.text:
                  replace_para_text(p,'Pilot Forms v1.1 | September 9, 2026')
          for table in doc.tables:
              for row in table.rows:
                  if len(row.cells)>=3 and 'RFR can perform work within current capabilities' in row.cells[1].text:
                      row.cells[1].text='RFR can perform work within current capabilities and risk controls'
                      row.cells[2].text='Litigation/legal dispute identified or ruled out; if Yes, elevated-risk review'
          footer_v11(doc); doc.save(path)

          # 03 Risk Review
          path=Path('forms/08.26.26_03_Risk_Review_Checklist.docx')
          doc=Document(path)
          for p in doc.paragraphs:
              if 'Pilot Forms v1.0' in p.text:
                  replace_para_text(p,'Pilot Forms v1.1 | September 9, 2026')
          for table in doc.tables:
              for row in table.rows:
                  if len(row.cells)>=3 and 'Request may cross into' in row.cells[0].text:
                      row.cells[0].text='Professional-advice scope issue OR active/reasonably anticipated litigation / legal dispute'
                      row.cells[2].text='Narrow/decline professional advice. Litigation: elevated-risk review; preserve sources; no external AI without appropriate authorization; legal-strategy work outside scope'
          footer_v11(doc); doc.save(path)

          # 05 Service Agreement
          path=Path('forms/08.27.26.v2_05_Service_Agreement_General_Authorization.docx')
          doc=Document(path)
          for p in doc.paragraphs:
              if 'Pilot Forms v1.0' in p.text:
                  replace_para_text(p,'Pilot Forms v1.1 | September 9, 2026')
          if not any('active or reasonably anticipated litigation' in p.text.lower() for p in doc.paragraphs):
              for p in doc.paragraphs:
                  if p.text.startswith('RFR provides information-organization'):
                      insert_after(p,'If material is connected to active or reasonably anticipated litigation or a legal dispute, RFR applies elevated-risk review. RFR does not provide legal strategy or legal advice, and customer material will not be submitted to an external AI service without appropriate authorization.')
                      break
          footer_v11(doc); doc.save(path)

          # 06 External AI Authorization
          path=Path('forms/08.26.26_06_External_AI_Authorization.docx')
          doc=Document(path)
          for p in doc.paragraphs:
              if 'Pilot Forms v1.0' in p.text:
                  replace_para_text(p,'Pilot Forms v1.1 | September 9, 2026')
          if not any('active or reasonably anticipated litigation' in p.text.lower() for p in doc.paragraphs):
              for p in doc.paragraphs:
                  if p.text.strip().startswith('[ ] RFR will perform human QC'):
                      insert_after(p,'[ ] If the material is connected to active or reasonably anticipated litigation or a legal dispute, RFR has completed elevated-risk review. This authorization does not authorize legal-strategy work, and external AI use is limited to the expressly approved task and material.')
                      break
          footer_v11(doc); doc.save(path)

          # 19 Privacy Policy
          path=Path('forms/08.27.26.v2_19_Privacy_Data_Handling_Policy.docx')
          doc=Document(path)
          for p in doc.paragraphs:
              if 'Pilot Forms v1.0 | Effective August 26, 2026' in p.text:
                  replace_para_text(p,'Pilot Forms v1.1 | Effective September 9, 2026')
              if p.text.startswith('Use of an external artificial intelligence service requires express customer authorization.'):
                  replace_para_text(p,'Use of an external artificial intelligence service requires express customer authorization. Remote access also requires separate authorization. If project material is connected to active or reasonably anticipated litigation or a legal dispute, Raw File Rescue applies elevated-risk review, does not submit that material to an external AI service without appropriate authorization, and does not provide legal strategy or legal advice. A browser bookmark export reveals saved page addresses; it does not provide account passwords or authorize account access.')
          footer_v11(doc); doc.save(path)

          # Website callout: insert once at the end of the policies section.
          ip=Path('index.html')
          html=ip.read_text(encoding='utf-8')
          marker='Litigation-sensitive material'
          if marker not in html:
              pos=html.find('id="policies"')
              if pos < 0:
                  raise SystemExit('policies section not found')
              end=html.find('</section>',pos)
              if end < 0:
                  raise SystemExit('policies section end not found')
              callout='<div class="container"><div class="control-panel"><h3>Litigation-sensitive material</h3><p>If your files are connected to active or reasonably anticipated litigation or a legal dispute, I treat them as elevated-risk. I do not submit that material to external AI without appropriate authorization, and Raw File Rescue does not provide legal strategy or legal advice.</p></div></div>'
              html=html[:end]+callout+html[end:]
              ip.write_text(html,encoding='utf-8')
          PY

          rm -rf /tmp/rfrpdf && mkdir -p /tmp/rfrpdf
          libreoffice --headless --convert-to pdf --outdir /tmp/rfrpdf forms/08.27.26.v2_05_Service_Agreement_General_Authorization.docx >/dev/null
          cp /tmp/rfrpdf/08.27.26.v2_05_Service_Agreement_General_Authorization.pdf forms/08.27.26.v2_05_Service_Agreement_General_Authorization.pdf
          rm -rf /tmp/rfrpdf && mkdir -p /tmp/rfrpdf
          libreoffice --headless --convert-to pdf --outdir /tmp/rfrpdf forms/08.27.26.v2_19_Privacy_Data_Handling_Policy.docx >/dev/null
          cp /tmp/rfrpdf/08.27.26.v2_19_Privacy_Data_Handling_Policy.pdf policies/08.27.26.v2_19_Privacy_Data_Handling_Policy.pdf

      - name: Commit alignment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html forms/08.26.26_01_Customer_Intake_Form.docx forms/08.26.26_02_Qualification_Checklist.docx forms/08.26.26_03_Risk_Review_Checklist.docx forms/08.27.26.v2_05_Service_Agreement_General_Authorization.docx forms/08.27.26.v2_05_Service_Agreement_General_Authorization.pdf forms/08.26.26_06_External_AI_Authorization.docx forms/08.27.26.v2_19_Privacy_Data_Handling_Policy.docx policies/08.27.26.v2_19_Privacy_Data_Handling_Policy.pdf
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Align RFR forms and website with v7.2 safeguards'
            git push origin HEAD:main
          fi
