name: Add chat consolidation service card
on:
  push:
    paths:
      - '.github/workflows/add-chat-consolidation-card.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split chat consolidation into its own card
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<a href="samples/pepper-riot/08.23.26_RFR_Pepper_Riot_Multi_Chat_Project_Consolidation_Sample.pdf" rel="noopener" target="_blank">Multiple chats → one document →</a>'
          if old not in s:
              raise SystemExit('Multi-chat link not found')
          s=s.replace(old,'',1)
          marker='</div></article><article class="card"><h3>Need specific information pulled out of a pile?</h3>'
          card='</div></article><article class="card"><h3>Keep the result without keeping every chat.</h3><span class="note">Multiple Conversations → One Document</span><p>Consolidate related AI conversations into one organized project record, keeping the useful decisions, conclusions, and work while cutting repetition.</p><a href="samples/pepper-riot/08.23.26_RFR_Pepper_Riot_Multi_Chat_Project_Consolidation_Sample.pdf" rel="noopener" target="_blank">View demonstration →</a></article><article class="card"><h3>Need specific information pulled out of a pile?</h3>'
          if marker not in s:
              raise SystemExit('Insertion point not found')
          s=s.replace(marker,card,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add multiple-conversation consolidation service"
          git push