name: One-time website structure cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply approved website cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # 1) Simplify header nav to four primary links.
          old_nav = '<nav aria-label="Primary" class="nav-links"><a href="#services">How I Can Help</a><a href="#examples">Examples</a><a href="#pricing">Pricing</a><a href="policies/08.27.26.v2_18_Cancellation_Refund_Policy.pdf" rel="noopener" target="_blank">Refund Policy</a><a href="policies/08.27.26.v2_19_Privacy_Data_Handling_Policy.pdf" rel="noopener" target="_blank">Privacy</a><a href="#contact">Contact</a></nav>'
          new_nav = '<nav aria-label="Primary" class="nav-links"><a href="#services">How I Can Help</a><a href="#examples">Examples</a><a href="#pricing">Pricing</a><a href="#contact">Contact</a></nav>'
          if old_nav in s:
              s = s.replace(old_nav, new_nav, 1)

          # 2) Remove redundant complimentary-consultation pill, but keep the full consultation card.
          pill = '<p class="offer">✓ Complimentary consultation—no charge before you approve the written plan and paid work begins</p>'
          s = s.replace(pill, '')

          # 3) Restore the concrete 80% example immediately after the no-surprise-overages explanation.
          example = '<p><strong>Example:</strong> $300 maximum → 80% point is $240, or about 8 hours of labor.</p>'
          if example not in s:
              needle = 'When labor is the main cost, I’ll also show the approximate number of hours. I stop for written approval before going over the maximum.</p>'
              if needle in s:
                  s = s.replace(needle, needle + example, 1)

          # 4) Put How It Works before Pricing; leave Heritage Partner content inside Pricing untouched.
          pricing_marker = '<section class="section" id="pricing">'
          how_marker = '<section class="section alt" id="how-it-works">'
          policies_marker = '<section class="section" id="policies">'
          ps = s.find(pricing_marker)
          hs = s.find(how_marker)
          pols = s.find(policies_marker)
          if ps != -1 and hs != -1 and pols != -1 and ps < hs < pols:
              pricing_block = s[ps:hs]
              how_block = s[hs:pols]
              s = s[:ps] + how_block + pricing_block + s[pols:]

          p.write_text(s, encoding='utf-8')
          PY

          git config user.name "sigilslxtx-cpu"
          git config user.email "sigilslxtx@gmail.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index changes needed"
          else
            git commit -m "Reorder sections and simplify website navigation"
            git push
          fi