name: 08.28.26 Plain English Cleanup V2
on:
  push:
    paths:
      - '.github/workflows/08.28.26_plain_english_cleanup_v2.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install beautifulsoup4
      - run: |
          python - <<'PY'
          from bs4 import BeautifulSoup
          from pathlib import Path
          p=Path('index.html'); soup=BeautifulSoup(p.read_text(encoding='utf-8'),'html.parser')

          # Hero offer.
          off=soup.select_one('.hero .offer')
          if off: off.string='✓ Complimentary pilot consultation—no charge before you approve the written plan and paid work begins'

          # Services: replace technical secondary label and extraction CTA.
          services=soup.find(id='services')
          if services:
              for card in services.select('.card'):
                  note=card.find('span',class_='note')
                  if note and note.get_text(strip=True)=='Data Extraction': note.string='Information Pulled From Your Files'
                  a=card.find('a')
                  if a and a.get_text(' ',strip=True)=='Open extraction sample →': a.string='See Information Pulled Into a Usable Spreadsheet →'

          # Examples intro and access explanation.
          ex=soup.find(id='examples')
          if ex:
              hp=ex.select_one('.heading p')
              if hp: hp.string='These fictional examples show what Raw File Rescue can do. No customer files are shown. Every job is planned around the material you actually want help with.'
              cp=ex.select_one('.control-panel p')
              if cp: cp.string='For standard remote work, you share only the files or folders included in the plan you approved. Raw File Rescue does not ask for your account password. Before I make changes to files you control, I confirm with you that a backup or recoverable starting copy exists. Anything that might be deleted is set aside for your review. I do not permanently delete your files as part of the standard pilot process.'

          # Pricing left column + list.
          pricing=soup.find(id='pricing')
          if pricing:
              consult=pricing.select_one('.consult')
              if consult:
                  strong=consult.find('strong')
                  if strong: strong.string='No charge before you approve the written plan and paid work begins.'
                  lis=consult.find_all('li')
                  vals=['Initial inquiry and basic fit check','Talk through what is causing the problem','Discuss a practical way to tackle it','Prepare the written plan and estimate']
                  for li,val in zip(lis,vals): li.string=val
              price=pricing.select_one('.price-card')
              if price:
                  lab=price.find('div',class_='label')
                  if lab: lab.string='Pilot Paid-Work Rate'
                  ps=price.find_all('p')
                  if ps:
                      ps[0].string='This is an hourly rate—not a flat $30 price for the whole job. Billing starts only after you approve the written plan and I begin the work you approved. Time is billed in 15-minute increments.'
                  if len(ps)>1:
                      ps[1].clear(); b=soup.new_tag('strong'); b.string='Paid time is recorded through Clockify; an itemized time report is available on request.'; ps[1].append(b)
              pc=pricing.select_one('.pricing-copy')
              if pc:
                  paras=pc.find_all('p',recursive=False)
                  if len(paras)>1: paras[1].string='The $30/hour pilot rate applies only after you approve the written plan. Talking through the problem, checking whether the job is a good fit, reviewing risks, and preparing the plan and estimate are complimentary unless you explicitly approve a paid assessment.'
                  ul=pc.find('ul',class_='checks')
                  if ul:
                      for li in ul.find_all('li'):
                          txt=li.get_text(' ',strip=True)
                          txt=txt.replace('Quality control, delivery, and one basic correction round within scope','A final check, delivery, and one basic correction round within what we agreed')
                          txt=txt.replace('Customer-specific travel only when it is part of the approved plan','Travel for your job only when it is part of the plan you approved')
                          li.string=txt

          # Reassurance cards.
          how=soup.find(id='how-it-works')
          if how:
              reass=how.select('.reassurance > div')
              if len(reass)>1:
                  reass[1].find('strong').string='Temporary Copies Deleted After 7 Days'
                  reass[1].find('p').string='Temporary copies I make while working are ordinarily deleted seven calendar days after your finished work is sent or made available, and I record that the deletion was completed.'
              if len(reass)>2:
                  reass[2].find('strong').string='Backup Before I Make Changes'
                  reass[2].find('p').string='Before I change files you control, I confirm with you that a backup or recoverable starting copy exists.'
              if len(reass)>3:
                  reass[3].find('strong').string='Your Paper Stays With You'
                  reass[3].find('p').string='Paper scanning during the pilot is done on site. I do not take your originals away.'

          # Policy summaries in customer language.
          policies=soup.find(id='policies')
          if policies:
              cards=policies.select('.policy')
              if len(cards)>0:
                  ps=cards[0].find_all('p')
                  if len(ps)>0:
                      ps[0].clear(); b=soup.new_tag('strong'); b.string='Before paid work starts:'; ps[0].append(b); ps[0].append(' the initial inquiry, fit check, discussion, consultation, and preparation of the written plan are complimentary during the pilot.')
                  if len(ps)>1:
                      ps[1].clear(); b=soup.new_tag('strong'); b.string='If you cancel before paid work starts:'; ps[1].append(b); ps[1].append(' prepaid labor is refunded in full. Outside expenses you already approved and that were already incurred may not be refundable.')
                  if len(ps)>2:
                      ps[2].clear(); b=soup.new_tag('strong'); b.string='If you cancel after paid work starts:'; ps[2].append(b); ps[2].append(' you pay for work already completed and approved expenses already incurred. Any unused prepaid labor is refunded.')
                  if len(ps)>3:
                      ps[3].clear(); ps[3].append('Paid work starts only after you approve the written plan and I begin the work described in it. '); a=soup.new_tag('a',href='policies/08.27.26.v2_18_Cancellation_Refund_Policy.pdf',target='_blank',rel='noopener',attrs={'class':'text-link'}); a.string='Read the complete policy (PDF).'; ps[3].append(a)
              if len(cards)>1:
                  ps=cards[1].find_all('p')
                  if len(ps)>1: ps[1].string='Temporary copies I make while working are ordinarily deleted seven days after your finished work is sent or made available. I record when that deletion is completed.'
                  if len(ps)>2: ps[2].string='Using an outside AI service with your material is optional and requires your express permission. For bookmark cleanup, you send an exported bookmark file; I do not ask for your browser password or account access.'
                  if len(ps)>3: ps[3].string='If you share a cloud folder with Raw File Rescue, access is limited to what you approved. When the job is finished, I remove my access where possible and confirm with you that any sharing you control has been turned off. I record that closeout.'
              for card in cards:
                  h=card.find('h3')
                  if h and h.get_text(strip=True)=='Project Documentation':
                      h.string='Written Records'
                      ps=card.find_all('p')
                      if ps: ps[0].string='I keep written records of what we agreed to, what work was done, what was delivered, and how the job was closed out. When relevant, that includes confirming shared cloud access was closed and temporary working copies were deleted.'
                      if len(ps)>1: ps[1].string='I ask for extra permission before using an outside AI service, a remote-access tool, making decisions about possible duplicate versions, or taking another step that creates a meaningful new risk.'

          # Bottom CTA and footer.
          contact=soup.find(id='contact')
          if contact:
              cp=contact.select_one('.cta-box > div > p')
              if cp: cp.string="That's fine. Tell me what's giving you trouble, and I'll help figure out a practical way to tackle it. You'll see the written plan and estimate before any paid work begins."
          footer=soup.find('footer')
          if footer:
              for a in footer.find_all('a'):
                  if a.get_text(strip=True)=='AI chats': a.string='AI conversations'

          p.write_text(str(soup),encoding='utf-8')
          PY
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/08.28.26_plain_english_cleanup_v2.yml
          git commit -m 'Finish plain-English customer-facing cleanup'
          git push
