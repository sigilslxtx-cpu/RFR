name: Remove consultation pill
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/remove-consultation-pill.yml'
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate consultation pill
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<span class="offer">✓ Complimentary consultation—no charge before you approve the written plan and paid work begins</span>'
          if old not in s:
              raise SystemExit('Consultation pill text not found; no change made.')
          s = s.replace(old, '', 1)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove duplicate complimentary consultation pill"
          git push
