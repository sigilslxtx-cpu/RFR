name: 08.28.26 Fix Top Navigation
on:
  push:
    paths:
      - '.github/workflows/08.28.26_fix_top_navigation.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - name: Fix responsive navigation
        run: |
          python - <<'PY'
          from bs4 import BeautifulSoup
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('@media(max-width:980px){.nav-links{display:none}.hero-grid,.pricing{grid-template-columns:1fr}', '@media(max-width:980px){.nav{gap:16px}.brand img{width:205px}.nav-links{gap:14px;font-size:.84rem}.phone{font-size:.9rem}.hero-grid,.pricing{grid-template-columns:1fr}')
          s=s.replace('@media(max-width:680px){.container{width:min(calc(100% - 28px),var(--max))}.phone{display:none}.brand img{width:190px}', '@media(max-width:760px){.site-header .nav{flex-wrap:wrap;gap:0;min-height:auto;padding:10px 0}.site-header .brand{margin-right:auto}.site-header .brand img{width:190px}.site-header .phone{font-size:.86rem}.site-header .nav-links{order:3;width:100%;display:flex;overflow-x:auto;gap:0;margin-top:9px;border-top:1px solid var(--border);scrollbar-width:none}.site-header .nav-links::-webkit-scrollbar{display:none}.site-header .nav-links a{flex:0 0 auto;padding:9px 12px;font-size:.82rem;white-space:nowrap}.site-header .nav-links a:nth-child(4),.site-header .nav-links a:nth-child(5){display:none}}@media(max-width:680px){.container{width:min(calc(100% - 28px),var(--max))}.phone{display:none}.brand img{width:190px}')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and clean workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/08.28.26_fix_top_navigation.yml
          git commit -m 'Keep top navigation visible across screen sizes'
          git push
