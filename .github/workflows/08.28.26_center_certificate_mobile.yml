name: 08.28.26 Center Certificate Mobile
on:
  push:
    paths:
      - '.github/workflows/08.28.26_center_certificate_mobile.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Center certificate badge on mobile
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='@media(max-width:680px){'
          insert='@media(max-width:680px){.affiliation>a{display:block;width:100%;}.affiliation>a img{margin-left:auto;margin-right:auto;}\n'
          if insert not in s:
              s=s.replace(marker,insert,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/08.28.26_center_certificate_mobile.yml
          git commit -m 'Center certificate badge on mobile'
          git push
