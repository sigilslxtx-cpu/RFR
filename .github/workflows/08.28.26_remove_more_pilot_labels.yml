name: 08.28.26 Remove More Pilot Labels
on:
  push:
    paths:
      - '.github/workflows/08.28.26_remove_more_pilot_labels.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('delete your files as part of the standard pilot process.','delete your files as part of the standard process.')
          s=s.replace('Pilot Paid-Work Rate','Paid-Work Rate')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/08.28.26_remove_more_pilot_labels.yml
          git commit -m 'Remove remaining redundant pilot labels'
          git push
