name: 08.28.26 Plain English Website Update
on:
  push:
    paths:
      - '.github/workflows/08.28.26_plain_english_update.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - name: Rewrite jargon in index
        run: |
          python - <<'PY'
          from bs4 import BeautifulSoup
          from pathlib import Path
          p=Path('index.html')
          soup=BeautifulSoup(p.read_text(encoding='utf-8'),'html.parser')

          # Pepper Riot intro: fictional + benefit-first.
          g=soup.find(id='business-examples')
          if g:
              gp=g.find('p',class_='group-copy')
              if gp: gp.string='Pepper Riot is a fictional business created to show how scattered business records can become easier to find, understand, and use.'

          # Sample links: say what a customer will see/get.
          repl={
              'View Raw Chat — Before →':'See the Original Conversation →',
              'View Chat Summary Sample →':'See the Key Points Pulled Out →',
              'View Full Chat-to-Document Sample →':'See the Conversation Turned Into a Useful Document →',
              'View Multi-Chat Consolidation →':'See Several Conversations Combined Into One Document →'
          }
          for a in soup.find_all('a'):
              t=a.get_text(' ',strip=True)
              if t in repl: a.string=repl[t]

          # Chat area wording.
          cg=soup.find(id='chat-examples')
          if cg:
              h=cg.find('h3')
              if h: h.string='Useful work pulled out of AI conversations'
              gp=cg.find('p',class_='group-copy')
              if gp: gp.string='Long AI conversations can become clear working documents, key points, action lists, and project records you can actually use.'
              caps=cg.find_all('figcaption')
              if len(caps)>0: caps[0].string='Key Points Pulled Out of a Conversation'
              if len(caps)>1: caps[1].string='Conversation Turned Into a Useful Document'

          # Public-facing scope language: explain instead of making people learn RFR terms.
          hero=soup.select_one('section.hero')
          if hero:
              pp=hero.select('p.hero-copy')
              if len(pp)>1:
                  pp[1].clear()
                  b=soup.new_tag('strong'); b.string='What “pilot” means:'; pp[1].append(b)
                  pp[1].append(' Pilot describes the introductory phase of the service—not experimental handling of customer files. Before paid work begins, you see what I’ll do, what you’ll receive, the expected cost, and the safeguards that apply. You stay in control of access and deletion decisions.')

          pricing=soup.find(id='pricing')
          if pricing:
              pc=pricing.select_one('.pricing-copy')
              if pc:
                  paras=pc.find_all('p',recursive=False)
                  if paras:
                      paras[0].string='Every backlog is different. We start by talking through the problem. Before paid work begins, I give you a written plan showing what I’ll do, what you’ll receive, the expected cost, and the maximum project cost unless you approve a change.'
                  # Rewrite ceiling box in plain English.
                  for cost in pc.find_all('div',class_='cost'):
                      h=cost.find('h3')
                      if h and h.get_text(strip=True)=='No surprise overages':
                          ps=cost.find_all('p')
                          if len(ps)>0: ps[0].string='Your quote includes an expected total and a maximum project cost. That maximum includes paid work, customer-specific travel time, approved travel expenses, and approved outside costs. I’ll warn you at about 80% of that maximum—or sooner if the remaining work looks likely to reach it—and I stop for written approval before going over it.'
                          if len(ps)>1: ps[1].string='I also ask before adding an extra on-site trip or making a change that adds something new, changes how I need to access the material, adds an approved expense, adds more than 30 minutes of paid work beyond what we agreed, or would push the project over the maximum.'

          pol=soup.find(id='service-terms')
          if pol:
              h=pol.find('h3')
              if h: h.string='What We Agree On Before Work Starts'
              ps=pol.find_all('p')
              if ps:
                  ps[0].string='Before billable work begins, you receive a written plan showing what I’ll do, what you’ll receive, the expected cost, and the maximum project cost. I ask before making a change that adds something new, requires an extra unplanned trip, adds an approved expense, adds more than 30 minutes of paid work beyond what we agreed, or would push the project over the maximum. I warn you at about 80% of the maximum—or sooner if the remaining work is likely to reach it.'
              if len(ps)>1:
                  ps[1].string='One basic correction round is included for errors or reasonable adjustments within what we agreed. New requests may require a revised estimate.'

          # How it works: remove scope/ceiling vocabulary.
          how=soup.find(id='how-it-works')
          if how:
              steps=how.select('.step')
              if len(steps)>1:
                  steps[1].find('h3').string='Review the Plan'
                  steps[1].find('p').string='I review the material, ask questions, and spell out what I’ll do, what you’ll receive, and what it should cost.'
              if len(steps)>2:
                  steps[2].find('p').string='I do the work we agreed on and check with you before making a meaningful change or going over the approved maximum.'

          # Policy intro and project documentation: plain English.
          policies=soup.find(id='policies')
          if policies:
              hp=policies.select_one('.heading p')
              if hp: hp.string='Before paid work begins, we document what I’ll do, what you’ll receive, what it should cost, and how your material will be handled.'
              for card in policies.select('.policy'):
                  h=card.find('h3')
                  if h and h.get_text(strip=True)=='Project Documentation':
                      ps=card.find_all('p')
                      if ps: ps[0].string='Accepted projects use written records showing what we agreed to, what work was done, what was delivered, and how the project was closed out. When relevant, that includes confirmation that customer-owned cloud access was closed and temporary working copies were deleted.'
                      if len(ps)>1: ps[1].string='Extra permission is required before using outside AI services, remote-access tools, making duplicate/version decisions, or taking another step that creates a meaningful new risk.'

          # Replace technical service labels where they appear in explanatory copy, while keeping names as secondary labels.
          text_repls={
              'Data Extraction':'Information Pulled From Your Files',
              'Chat Extraction Demonstration':'Key Points Pulled Out of a Conversation'
          }
          # Only headings/captions/footer labels, not filenames/URLs.
          for tag in soup.find_all(['h3','figcaption']):
              t=tag.get_text(' ',strip=True)
              if t in text_repls: tag.string=text_repls[t]

          p.write_text(str(soup),encoding='utf-8')
          PY
      - name: Commit and clean up workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/08.28.26_plain_english_update.yml
          git commit -m 'Replace customer-facing jargon with plain English'
          git push
