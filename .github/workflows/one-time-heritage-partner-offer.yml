name: One-time Heritage Partner offer update
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/one-time-heritage-partner-offer.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Heritage Partner Pilot offer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          marker = '<div class="cost">'
          offer = '<div class="consult"><h3>Heritage Partner Pilot</h3><p><strong>$22.50/hour for the first 3 billable hours</strong> of one clearly defined project for history and heritage organizations. Any additional authorized work returns to the normal $30/hour rate.</p></div>'
          if 'Heritage Partner Pilot' not in s:
              if marker not in s:
                  raise SystemExit('Pricing insertion point not found')
              s = s.replace(marker, offer + marker, 1)
              p.write_text(s)
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Restore Heritage Partner Pilot offer'
          git push
