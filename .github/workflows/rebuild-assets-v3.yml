name: Rebuild RFR v3 assets

on:
  push:
    paths:
      - 'scripts/rebuild_assets_v3.py'
      - '.github/workflows/rebuild-assets-v3.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image/PDF dependencies
        run: pip install pillow reportlab
      - name: Rebuild assets
        run: python scripts/rebuild_assets_v3.py
      - name: Commit rebuilt assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Rebuild v3 web assets and remove image taglines"
            git push
          fi
